<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order Form | X REDRO</title>
  <link rel="stylesheet" href="css/form.shared.css">
  <link rel="stylesheet" href="css/alert.css" />
  <!-- Per-theme Google Fonts — each theme picks its own family below,
       giving every design its own typographic identity -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Space+Grotesk:wght@400;500&family=Archivo+Black&family=Inter:wght@400;500&family=Quicksand:wght@500;700&family=Sora:wght@600;700&family=Playfair+Display:wght@400;500&family=Roboto+Condensed:wght@400;700&family=Poppins:wght@500;700;800&family=Cormorant+Garamond:wght@500;600&family=Fredoka:wght@600;700&display=swap">
  <!-- Visual theme skins — the correct one is applied at runtime via a
       class on #formRoot's .preview-theme wrapper, set from the form's
       saved `theme` value (see initForm() in js/form.js). All four are
       safe to load together since every rule is scoped under its own
       theme-rX class. -->
  <link rel="stylesheet" href="css/theme-r1.css">
  <link rel="stylesheet" href="css/theme-r2.css">
  <link rel="stylesheet" href="css/theme-r3.css">
  <link rel="stylesheet" href="css/theme-r4.css">
  <link rel="stylesheet" href="css/theme-r5.css">
  <link rel="stylesheet" href="css/theme-r6.css">
  <link rel="stylesheet" href="css/theme-r7.css">
  <link rel="stylesheet" href="css/theme-r8.css">
  <link rel="stylesheet" href="css/theme-r9.css">
</head>
<body>
  <div id="formRoot"></div>
  <div id="toast-container"></div>
  <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.0"></script>
  <script src="js/storefront-render.js"></script>
  <script src="js/form.js"></script>
  <script src="js/alert.js"></script>
</body>
</html>
