<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>X-Redro permission check</title>
<style>body{font:16px/1.5 system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:8px;text-align:left;vertical-align:top}
.ok{color:#1d6b3a;font-weight:700}.warn{color:#9a5b00;font-weight:700}.bad{color:#b03226;font-weight:700}code{background:#eee;padding:1px 4px;border-radius:4px}</style></head>
<body>
<h1>X-Redro permission check</h1>
<p>Open this page <b>while signed out of X-Redro</b> (a private window is fine). It asks your Appwrite project the questions a stranger's browser could ask, and reports what a stranger can read. It changes nothing.</p>
<button id="run" style="font:inherit;padding:10px 18px">Run check</button>
<table id="out" hidden><thead><tr><th>Collection</th><th>A stranger can…</th><th>What it means</th></tr></thead><tbody></tbody></table>
<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
<script>
const client = new Appwrite.Client().setEndpoint("https://nyc.cloud.appwrite.io/v1").setProject("695981480033c7a4eb0d");
const db = new Appwrite.Databases(client), DB = "695c4fce0039f513dc83";
const rows = [
  ["orders", "orders", "Every order (names, phones, items) is readable by anyone. Public Order IDs are then NOT secret, because anyone can list them. Order cards still help customers, but treat IDs as identifiers, not passwords."],
  ["order_updates", "order_updates", "Expected: customers must be able to read their order's updates, so this being readable is normal. Updates carry no secrets beyond the order itself."],
  ["order_reviews", "order_reviews", "Seller decisions are readable by design (customers see approved / rejected)."],
  ["form", "form", "Stores are public by design (they are your storefronts)."],
  ["695c501b001d24549b03", "users (seller profiles)", "Should NOT be listable by strangers: it holds emails and, with Telegram, chat IDs. If it says 'can list', restrict the collection (read: Users only, document security on)."],
  ["telegram_connections", "telegram_connections", "Must NOT be readable: it holds connection records. Only the Worker (API key) should touch it."],
  ["telegram_events", "telegram_events", "Must NOT be readable."]
];
const mustBeClosed = ["695c501b001d24549b03", "telegram_connections", "telegram_events"];
document.getElementById("run").onclick = async () => {
  const tb = document.querySelector("#out tbody"); tb.innerHTML = ""; document.getElementById("out").hidden = false;
  for (const [id, label, meaning] of rows) {
    let verdict, cls;
    try {
      const r = await db.listDocuments(DB, id, [Appwrite.Query.limit(1)]);
      if (r.total > 0 || r.documents.length) { verdict = "list documents (" + (r.total || "some") + " found)"; cls = mustBeClosed.includes(id) ? "bad" : (id === "orders" ? "warn" : "ok"); }
      else { verdict = "list, but nothing is there yet (or none visible)"; cls = "ok"; }
    } catch (e) {
      if (e.code === 404) { verdict = "nothing: collection does not exist yet"; cls = "warn"; }
      else if (e.code === 401 || e.code === 403) { verdict = "nothing (not allowed)"; cls = mustBeClosed.includes(id) ? "ok" : (id === "orders" ? "ok" : "warn"); }
      else { verdict = "error " + (e.code || "") + ": " + e.message; cls = "warn"; }
    }
    const tr = document.createElement("tr");
    tr.innerHTML = `<td><code>${label}</code></td><td class="${cls}">${verdict}</td><td>${mustBeClosed.includes(id) && cls === "bad" ? "<b>Fix this.</b> " : ""}${meaning}</td>`;
    tb.appendChild(tr);
  }
};
</script></body></html>
