<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Test page for tools/browser/check_stores.py. Renders one store with the real renderer and preview runtime.
     Query: t=r1..r9, banner=wide|tall|square|small, n=product count, cats=1 for three categories, tag=0 for no tagline -->
<script>
const q = new URLSearchParams(location.search); const T = q.get("t") || "r3";
["form.shared.css", "storefront-base.css", "theme-" + T + ".css"].forEach(f => document.write('<link rel="stylesheet" href="../../css/' + f + '">'));
</script></head><body><div id="root"></div>
<script src="../../js/storefront-render.js"></script><script src="../../js/storefront-chrome.js"></script>
<script>
const img = n => location.origin + "/__img/" + n + ".jpg";
const n = Number(q.get("n") || 8), cats = ["Bags", "Shoes", "Watches"];
const names = ["Black handbag", "Leather tote", "Gold wristwatch", "Silver necklace", "Canvas sneakers", "Sun hat", "Silk scarf", "Belt"];
const products = Array.from({ length: n }, (_, i) => ({ name: names[i % 8] + (i > 7 ? " " + i : ""), price: String(5000 + i * 2500), imageUrl: q.get("noimg") ? "" : img("p" + (i % 6)), category: q.get("cats") ? cats[i % 3] : "General", description: i % 2 ? "A lovely everyday piece" : "", featured: i === 1 || i === 4 }));
const cfg = { tagline: q.get("tag") === "0" ? "" : "Handmade in Lagos", about: "We make bags.", phone: "08012345678", instagram: "myshop" };
if (q.get("banner")) cfg.bannerUrl = img("banner-" + q.get("banner"));
const F = [{ id: "p1", type: "product", label: "Products", products }, { id: "t1", type: "text", label: "Full name" }];
window.__PREVIEW__ = { fields: F, formTitle: "Amaka Bags & More", formSubtitle: "Quality bags and shoes delivered nationwide", themeClass: "theme-" + T, storeConfig: cfg };
</script><script src="../../js/preview-runtime.js"></script></body></html>
